<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Repository Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; }

/* ── Title bar ── */
.apf-titlebar {
  display: flex; align-items: center; height: 40px;
  background: #161b22; border-bottom: 1px solid #30363d;
  padding: 0 12px; user-select: none; -webkit-app-region: drag;
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
}
.apf-titlebar .title { flex: 1; font-size: 13px; font-weight: 600; color: #8b949e; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apf-titlebar .apf-close { -webkit-app-region: no-drag; background: none; border: none; color: #8b949e; cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 4px; }
.apf-titlebar .apf-close:hover { background: #21262d; color: #e6edf3; }

/* ── Layout ── */
.layout { display: flex; height: calc(100vh - 40px); margin-top: 40px; }

/* ── Sidebar ── */
.sidebar {
  width: 280px; min-width: 160px; max-width: 400px;
  background: #0d1117; border-right: 1px solid #21262d;
  display: flex; flex-direction: column; overflow: hidden;
}
.sidebar-header { padding: 10px 12px; border-bottom: 1px solid #21262d; font-size: 11px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; }
.sidebar-tree {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
  padding: 6px 0 6px 0;
}
/* Tree nodes must NOT wrap so horizontal scroll works */
.tree-node { white-space: nowrap; display: block; }
.tree-row {
  display: inline-flex; align-items: center; padding: 4px 12px 4px 8px;
  cursor: pointer; gap: 5px; border-radius: 4px; margin: 1px 4px 1px 0;
  transition: background 0.1s; min-width: calc(100% - 8px);
}
.tree-row:hover { background: #161b22; }
.tree-row.active { background: #1f6feb22; border-left: 2px solid #1f6feb; }
.tree-row.disabled-content { opacity: 0.45; cursor: not-allowed; }
.tree-row .check { width: 14px; height: 14px; accent-color: #1f6feb; flex-shrink: 0; cursor: pointer; }
.tree-row .node-icon { font-size: 13px; width: 18px; text-align: center; flex-shrink: 0; }
.tree-row .node-label { font-size: 12px; white-space: nowrap; flex-shrink: 0; padding-right: 4px; }
.tree-row .node-badge { font-size: 10px; padding: 1px 5px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
.badge-fw  { background: #1f6feb33; color: #58a6ff; }
.badge-tpl { background: #2ea04333; color: #3fb950; }
.badge-ext { background: #d2930333; color: #f0883e; }
.badge-sub { background: #30363d; color: #8b949e; }
.badge-dup { background: #da363333; color: #f85149; }
.badge-ng  { background: #6e767d33; color: #6e767d; }
.tree-children { display: block; }
.tree-node.collapsed > .tree-children { display: none; }
.expand-btn { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 10px; width: 16px; flex-shrink: 0; text-align: center; padding: 0; }

/* Depth controls */
.depth-bar { padding: 8px 12px; border-top: 1px solid #21262d; flex-shrink: 0; }
.depth-bar label { font-size: 11px; color: #8b949e; display: block; margin-bottom: 4px; }
.depth-bar input[type=range] { width: 100%; accent-color: #1f6feb; }

/* ── Detail panel ── */
.detail { flex: 1; overflow-y: auto; padding: 20px 24px 80px 24px; }
.detail h2 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
.detail .subtitle { color: #8b949e; font-size: 12px; margin-bottom: 14px; }
.detail .section { margin-bottom: 16px; }
.detail .section-title { font-size: 11px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.detail .prop-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 4px; font-size: 12px; }
.detail .prop-key { color: #8b949e; width: 110px; flex-shrink: 0; }
.detail .prop-val { color: #e6edf3; word-break: break-word; }

/* Score chips */
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.chip-pos  { background: #2ea04333; color: #3fb950; }
.chip-neg  { background: #da363333; color: #f85149; }
.chip-score { background: #1f6feb33; color: #58a6ff; font-size: 13px; padding: 3px 10px; }

/* Conflict / warning banners */
.banner { border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 12px; }
.banner-dup  { background: #da363322; border: 1px solid #f85149; color: #f85149; }
.banner-ng   { background: #6e767d22; border: 1px solid #6e767d; color: #8b949e; }

/* External source panel */
.ext-panel { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 16px; }
.ext-panel .ext-url { color: #58a6ff; text-decoration: none; word-break: break-all; font-size: 12px; }
.ext-panel .open-btn { margin-top: 12px; }

/* Footer bar */
.footer {
  position: fixed; bottom: 0; left: 280px; right: 0;
  background: #161b22; border-top: 1px solid #30363d;
  padding: 10px 16px; display: flex; justify-content: flex-end; gap: 8px; z-index: 50;
}
.btn { padding: 7px 18px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn-primary { background: #1f6feb; color: #fff; }
.btn-primary:hover { background: #388bfd; }
.btn-primary:disabled { background: #21262d; color: #6e767d; cursor: not-allowed; }
.btn-secondary { background: #21262d; color: #e6edf3; border: 1px solid #30363d; }
.btn-secondary:hover { background: #30363d; }

/* Markdown content */
.md-content { line-height: 1.65; color: #c9d1d9; }
.md-content h1,.md-content h2,.md-content h3,.md-content h4 { margin: 18px 0 8px; color: #e6edf3; }
.md-content p { margin: 8px 0; }
.md-content code { background: #161b22; padding: 1px 5px; border-radius: 3px; font-family: "Cascadia Code", "Fira Code", monospace; font-size: 11px; color: #79c0ff; }
.md-content pre { background: #161b22; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 10px 0; }
.md-content pre code { background: none; padding: 0; }
.md-content ul,.md-content ol { margin: 6px 0 6px 20px; }
.md-content li { margin: 2px 0; }
.md-content a { color: #58a6ff; text-decoration: none; }
.md-content a:hover { text-decoration: underline; }
.md-content blockquote { border-left: 3px solid #30363d; padding-left: 12px; color: #8b949e; margin: 8px 0; }
.md-content hr { border: none; border-top: 1px solid #30363d; margin: 16px 0; }
.md-content table { border-collapse: collapse; font-size: 12px; margin: 8px 0; }
.md-content th,.md-content td { border: 1px solid #30363d; padding: 4px 10px; }
.md-content th { background: #161b22; }

/* Scrollbars */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
::-webkit-scrollbar-corner { background: transparent; }

/* Empty state */
.empty-state { color: #8b949e; font-size: 13px; margin-top: 60px; text-align: center; padding: 0 24px; }
</style>
</head>
<body>

<div class="apf-titlebar" pywebview-drag-region>
  <span class="title" id="window-title">Repository Viewer</span>
  <button class="apf-close" onclick="pywebview.api.close()">&#x2715;</button>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">Contents</div>
    <div class="sidebar-tree" id="tree-container"></div>
    <div class="depth-bar" id="depth-bar" style="display:none">
      <label>Submodule depth: <span id="depth-val">3</span></label>
      <input type="range" min="1" max="5" value="3" id="depth-slider" oninput="onDepthChange(this.value)">
    </div>
  </div>

  <div class="detail" id="detail-panel">
    <div class="empty-state" id="empty-hint">Select an item to view details.</div>
  </div>
</div>

<div class="footer" id="footer">
  <span id="selection-count" style="flex:1;color:#8b949e;font-size:12px;align-self:center"></span>
  <button class="btn btn-secondary" onclick="doCancel()">Cancel</button>
  <button class="btn btn-primary" id="add-btn" onclick="doConfirm()">Add Selected</button>
</div>

<script>
// ── Injected data ─────────────────────────────────────────────────────────────
const TREE_DATA = /*__TREE_JSON__*/;
const GAME_ID   = /*__GAME_ID__*/;
const REPO_URL  = /*__REPO_URL__*/;

// ── State ─────────────────────────────────────────────────────────────────────
let _selected_node = null;
let _current_docs_base = "";
let _repo_owner = "";
let _repo_name  = "";

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("window-title").textContent =
    REPO_URL ? `Repository Viewer — ${REPO_URL}` : "Repository Viewer";

  // Populate owner/name from root node for link resolution
  if (TREE_DATA.length > 0) {
    _repo_owner = TREE_DATA[0].owner || "";
    _repo_name  = TREE_DATA[0].repo  || TREE_DATA[0].label || "";
  }

  if (hasSubmodules(TREE_DATA)) {
    document.getElementById("depth-bar").style.display = "block";
  }

  renderTree();
  updateSelectionCount();

  // Auto-select: README.md at root level (first docs child of first repo node)
  const root = TREE_DATA[0];
  if (root) {
    const readme = (root.children || []).find(
      c => c.type === "docs" && c.label.toLowerCase() === "readme.md"
    );
    const firstDoc = (root.children || []).find(c => c.type === "docs");
    const target = readme || firstDoc;
    if (target) setTimeout(() => selectNodeById(target.id), 50);
  }
});

// ── Tree rendering ────────────────────────────────────────────────────────────
function renderTree() {
  const container = document.getElementById("tree-container");
  container.innerHTML = "";
  TREE_DATA.forEach(node => container.appendChild(buildNodeEl(node, 0)));
}

function buildNodeEl(node, depth) {
  const wrapper = document.createElement("div");
  wrapper.className = "tree-node";
  wrapper.dataset.id = node.id;

  const row = document.createElement("div");
  const isDisabled = node.disabled || !node.game_id_match;
  row.className = "tree-row" + (isDisabled ? " disabled-content" : "");
  row.style.paddingLeft = `${8 + depth * 14}px`;

  // Expand button (for nodes with children)
  if (node.children && node.children.length > 0) {
    const exp = document.createElement("button");
    exp.className = "expand-btn";
    exp.textContent = "▼";
    exp.onclick = e => { e.stopPropagation(); toggleCollapse(wrapper, exp); };
    row.appendChild(exp);
  } else {
    const sp = document.createElement("span");
    sp.className = "expand-btn";
    row.appendChild(sp);
  }

  // Checkbox (selectable nodes only)
  if (node.selectable && !isDisabled) {
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.className = "check";
    cb.checked = node.checked !== false;
    cb.dataset.id = node.id;
    cb.onclick = e => { e.stopPropagation(); node.checked = cb.checked; updateSelectionCount(); };
    row.appendChild(cb);
  }

  // Icon
  const icon = document.createElement("span");
  icon.className = "node-icon";
  icon.textContent = nodeIcon(node);
  row.appendChild(icon);

  // Label
  const label = document.createElement("span");
  label.className = "node-label";
  label.textContent = node.label;
  row.appendChild(label);

  // Badges
  appendBadges(row, node);

  if (!isDisabled) {
    row.addEventListener("click", () => selectNode(node, row));
  } else {
    row.style.cursor = "not-allowed";
  }
  wrapper.appendChild(row);

  // Children
  if (node.children && node.children.length > 0) {
    const childrenEl = document.createElement("div");
    childrenEl.className = "tree-children";
    node.children.forEach(child => childrenEl.appendChild(buildNodeEl(child, depth + 1)));
    wrapper.appendChild(childrenEl);
  }

  return wrapper;
}

function nodeIcon(node) {
  const t = node.type;
  if (t === "repo") return node.is_submodule ? "📦" : "📦";
  if (t === "mod")  return node.is_framework ? "⚙️" : "🧩";
  if (t === "template") return "📋";
  if (t === "docs") return "📄";
  if (t === "dir")  return "📁";
  if (t === "external") return "🔗";
  return "•";
}

function appendBadges(row, node) {
  if (node.type === "mod" && node.is_framework) {
    addBadge(row, "FW", "badge-fw");
  }
  if (node.type === "template") {
    addBadge(row, "TPL", "badge-tpl");
  }
  if (node.type === "external") {
    addBadge(row, (node.external_type || "EXT").toUpperCase().slice(0,3), "badge-ext");
  }
  if (node.is_submodule) {
    addBadge(row, "SUB", "badge-sub");
  }
  if (node.conflict) {
    addBadge(row, "DUP", "badge-dup");
  }
  if (!node.game_id_match && node.type === "mod") {
    addBadge(row, "N/G", "badge-ng");
  }
}

function addBadge(row, text, cls) {
  const b = document.createElement("span");
  b.className = `node-badge ${cls}`;
  b.textContent = text;
  row.appendChild(b);
}

function toggleCollapse(wrapper, btn) {
  wrapper.classList.toggle("collapsed");
  btn.textContent = wrapper.classList.contains("collapsed") ? "▶" : "▼";
}

function hasSubmodules(nodes) {
  return nodes.some(n => n.is_submodule || (n.children && hasSubmodules(n.children)));
}

// ── Node lookup ───────────────────────────────────────────────────────────────
function findNodeById(nodes, id) {
  for (const n of nodes) {
    if (n.id === id) return n;
    if (n.children) { const f = findNodeById(n.children, id); if (f) return f; }
  }
  return null;
}

function selectNodeById(id) {
  const wrapper = document.querySelector(`.tree-node[data-id="${CSS.escape(id)}"]`);
  if (!wrapper) return;
  const row = wrapper.querySelector(":scope > .tree-row");
  if (!row) return;
  const node = findNodeById(TREE_DATA, id);
  if (node) selectNode(node, row);
}

// Find a docs node by relative path from a base directory path
function findDocsByRelPath(nodes, relPath, basePath) {
  // Resolve path
  const base = basePath ? basePath.split("/") : [];
  const parts = relPath.split("/");
  const resolved = [...base];
  for (const p of parts) {
    if (p === "..") resolved.pop();
    else if (p !== ".") resolved.push(p);
  }
  const targetPath = resolved.join("/");
  return findNodeByPath(nodes, targetPath);
}

function findNodeByPath(nodes, targetPath) {
  for (const n of nodes) {
    if (n.path === targetPath) return n;
    if (n.children) { const f = findNodeByPath(n.children, targetPath); if (f) return f; }
  }
  return null;
}

// ── Node selection ────────────────────────────────────────────────────────────
function selectNode(node, rowEl) {
  document.querySelectorAll(".tree-row.active").forEach(r => r.classList.remove("active"));
  rowEl.classList.add("active");
  _selected_node = node;
  renderDetail(node);
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function renderDetail(node) {
  const panel = document.getElementById("detail-panel");
  const _eh = document.getElementById("empty-hint");
  if (_eh) _eh.style.display = "none";

  let html = "";

  if (node.type === "repo") {
    const childCount = (node.children || []).filter(c => c.type !== "docs").length;
    const subLabel = node.is_submodule ? "Submodule" : "Registry";
    html = `
      <h2>📦 ${escHtml(node.label)}</h2>
      <div class="subtitle">${subLabel} — ${escHtml(node.owner)}/${escHtml(node.repo)}</div>
      <div class="section">
        <div class="section-title">Contents</div>
        <div class="prop-row"><span class="prop-key">Folders</span><span class="prop-val">${childCount}</span></div>
        <div class="prop-row"><span class="prop-key">Owner</span><span class="prop-val">${escHtml(node.owner)}</span></div>
      </div>`;

  } else if (node.type === "dir") {
    html = `
      <h2>📁 ${escHtml(node.label)}</h2>
      <div class="subtitle">${escHtml(node.owner)}/${escHtml(node.repo)}</div>
      <div class="section">
        <div class="prop-row"><span class="prop-key">Path</span><span class="prop-val">${escHtml(node.path)}</span></div>
        <div class="prop-row"><span class="prop-key">Items</span><span class="prop-val">${(node.children || []).length}</span></div>
      </div>`;

  } else if (node.type === "mod") {
    const scoreChips = Object.entries(node.score_breakdown || {}).map(([k, v]) => {
      const cls = v >= 0 ? "chip-pos" : "chip-neg";
      const sign = v >= 0 ? "+" : "";
      return `<span class="chip ${cls}">${escHtml(k.replace(/_/g," "))} ${sign}${v}</span>`;
    }).join("");
    const conflictBanner = node.conflict
      ? `<div class="banner banner-dup">⚠ This mod is already registered from another source — adding it again will create a duplicate.</div>`
      : "";
    const ngBanner = !node.game_id_match
      ? `<div class="banner banner-ng">⚠ This mod targets a different game and cannot be selected.</div>`
      : "";
    html = `
      ${conflictBanner}${ngBanner}
      <h2>${node.is_framework ? "⚙️" : "🧩"} ${escHtml(node.label)}</h2>
      <div class="subtitle">${escHtml(node.owner)}/${escHtml(node.repo)} › ${escHtml(node.folder || node.path)}</div>
      <div class="section">
        <div class="section-title">Identity</div>
        <div class="prop-row"><span class="prop-key">Mod ID</span><span class="prop-val">${escHtml(node.mod_id)}</span></div>
        ${node.version ? `<div class="prop-row"><span class="prop-key">Version</span><span class="prop-val">${escHtml(node.version)}</span></div>` : ""}
        ${node.description ? `<div class="prop-row"><span class="prop-key">Description</span><span class="prop-val">${escHtml(node.description)}</span></div>` : ""}
        <div class="prop-row"><span class="prop-key">UE4SS info</span><span class="prop-val">${node.ue4ss_present ? "✔ Found" : "✗ Not found"}</span></div>
      </div>
      <div class="section">
        <div class="section-title">Score</div>
        <span class="chip chip-score">Score: ${node.score}</span>
        <div class="chips">${scoreChips || "<span style='color:#8b949e'>No breakdown available</span>"}</div>
      </div>`;
    const ue4ssInfo = node.ue4ss_info || {};
    const ue4ssKeys = Object.keys(ue4ssInfo);
    if (ue4ssKeys.length) {
      const rows = ue4ssKeys.map(k => {
        const v = ue4ssInfo[k];
        const valStr = (typeof v === "object") ? JSON.stringify(v) : String(v);
        return `<div class="prop-row"><span class="prop-key">${escHtml(k)}</span><span class="prop-val" style="font-size:11px;color:#8b949e">${escHtml(valStr)}</span></div>`;
      }).join('');
      html += `<div class="section"><div class="section-title">UE4SS Setup Options</div>${rows}</div>`;
    }

  } else if (node.type === "template") {
    const ngBanner = !node.game_id_match
      ? `<div class="banner banner-ng">⚠ This template targets a different game.</div>`
      : "";
    html = `
      ${ngBanner}
      <h2>📋 ${escHtml(node.label)}</h2>
      <div class="subtitle">${escHtml(node.owner)}/${escHtml(node.repo)}</div>
      <div class="section">
        <div class="section-title">Template Info</div>
        <div class="prop-row"><span class="prop-key">Game</span><span class="prop-val">${escHtml(node.game_dir || node.label)}</span></div>
        <div class="prop-row"><span class="prop-key">Path</span><span class="prop-val">${escHtml(node.path)}</span></div>
      </div>
      <div class="section">
        <div class="section-title">Expected Files</div>
        <ul style="margin:4px 0 0 16px;color:#8b949e;font-size:12px">
          <li>Regions.json</li><li>Items.json</li><li>Locations.json</li>
          <li>${escHtml(node.game_dir || "")}_options.json</li><li>logic/*.json</li>
        </ul>
      </div>`;

  } else if (node.type === "external") {
    const typeLabel = ((node.external_type || "external").charAt(0).toUpperCase() + (node.external_type || "external").slice(1));
    html = `
      <h2>🔗 ${escHtml(node.label)}</h2>
      <div class="subtitle">External Source — ${typeLabel}</div>
      <div class="ext-panel">
        <p style="color:#8b949e;margin-bottom:10px;font-size:12px">
          This content is hosted externally. Follow the linked page to install it manually.
        </p>
        <div class="prop-row"><span class="prop-key">Platform</span><span class="prop-val">${typeLabel}</span></div>
        <div class="prop-row"><span class="prop-key">URL</span>
          <span class="prop-val"><a class="ext-url" href="#" onclick="pywebview.api.open_url('${escAttr(node.external_url || "")}');return false">${escHtml(node.external_url || "")}</a></span>
        </div>
        <div class="open-btn">
          <button class="btn btn-secondary" onclick="pywebview.api.open_url('${escAttr(node.external_url || "")}')">Open in Browser</button>
        </div>
      </div>`;

  } else if (node.type === "docs") {
    html = `
      <h2>📄 ${escHtml(node.label)}</h2>
      <div class="subtitle" style="margin-bottom:14px">${escHtml(node.path || "")}</div>
      <div id="docs-content" class="md-content"></div>`;
  }

  panel.innerHTML = html;

  // Auto-load docs
  if (node.type === "docs") {
    const url = node.download_url || node.readme_url || "";
    _current_docs_base = node.path && node.path.includes("/")
      ? node.path.split("/").slice(0, -1).join("/")
      : "";
    if (url) {
      if (node.label.toLowerCase().endsWith(".json")) loadJson(url);
      else loadDocs(url);
    }
  }
}

// ── File loaders ─────────────────────────────────────────────────────────────
function loadJson(url) {
  const el = document.getElementById("docs-content");
  if (!el) return;
  el.innerHTML = "<p style='color:#8b949e;font-size:12px'>Loading…</p>";
  fetch(url)
    .then(r => r.text())
    .then(text => {
      try {
        const pretty = JSON.stringify(JSON.parse(text), null, 2);
        el.innerHTML = `<pre><code>${escHtml(pretty)}</code></pre>`;
      } catch {
        el.innerHTML = `<pre><code>${escHtml(text)}</code></pre>`;
      }
    })
    .catch(e => { el.innerHTML = `<p style='color:#f85149'>Failed to load: ${escHtml(String(e))}</p>`; });
}

function loadDocs(url) {
  const el = document.getElementById("docs-content");
  if (!el) return;
  el.innerHTML = "<p style='color:#8b949e;font-size:12px'>Loading…</p>";
  fetch(url)
    .then(r => r.text())
    .then(md => { el.innerHTML = mdToHtml(md); })
    .catch(e => { el.innerHTML = `<p style='color:#f85149'>Failed to load: ${escHtml(String(e))}</p>`; });
}

function mdToHtml(md) {
  // Escape HTML first, then apply markdown
  let s = md
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  // Fenced code blocks
  s = s.replace(/```[\w]*\n([\s\S]*?)```/gm, (_, code) => `<pre><code>${code}</code></pre>`);

  // Headings
  s = s
    .replace(/^######\s(.+)$/gm,"<h6>$1</h6>")
    .replace(/^#####\s(.+)$/gm,"<h5>$1</h5>")
    .replace(/^####\s(.+)$/gm,"<h4>$1</h4>")
    .replace(/^###\s(.+)$/gm,"<h3>$1</h3>")
    .replace(/^##\s(.+)$/gm,"<h2>$1</h2>")
    .replace(/^#\s(.+)$/gm,"<h1>$1</h1>");

  // Inline
  s = s
    .replace(/\*\*\*(.+?)\*\*\*/g,"<strong><em>$1</em></strong>")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");

  // HR
  s = s.replace(/^---+$/gm,"<hr>");

  // Links — distinguish internal vs external
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, text, href) => {
    const cleanHref = href.trim();
    if (cleanHref.startsWith("http://") || cleanHref.startsWith("https://")) {
      return `<a href="#" onclick="pywebview.api.open_url('${escapeSQ(cleanHref)}');return false">${text}</a>`;
    } else if (cleanHref.startsWith("#")) {
      // Anchor — attempt scroll within page
      return `<a href="${cleanHref}">${text}</a>`;
    } else if (cleanHref.toLowerCase().endsWith(".md")) {
      // Relative doc link — navigate sidebar
      return `<a href="#" onclick="navigateRelative('${escapeSQ(cleanHref)}');return false">${text}</a>`;
    } else {
      // Fallback: open on GitHub
      return `<a href="#" onclick="pywebview.api.open_url('https://github.com/${escapeSQ(_repo_owner)}/${escapeSQ(_repo_name)}/blob/master/${escapeSQ(cleanHref)}');return false">${text}</a>`;
    }
  });

  // Tables — pipe-delimited with a separator row
  s = s.replace(/((?:^|\n)\|[^\n]+\|[^\n]*\n\|[-:| \t]+\|[^\n]*(?:\n\|[^\n]+\|[^\n]*)*)/g, match => {
    const lines = match.trim().split('\n').filter(l => l.trim());
    if (lines.length < 2) return match;
    const splitRow = r => r.split('|').slice(1, -1).map(c => c.trim());
    const headers = splitRow(lines[0]);
    // Verify line 1 is a separator (only -, :, |, space)
    if (lines[1].replace(/[\|\-: \t]/g, '').length !== 0) return match;
    const th = headers.map(h => `<th>${h}</th>`).join('');
    const trs = lines.slice(2).map(l => `<tr>${splitRow(l).map(c => `<td>${c}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${th}</tr></thead><tbody>${trs}</tbody></table>`;
  });

  // Lists
  s = s.replace(/^[-*+]\s(.+)$/gm,"<li>$1</li>");
  s = s.replace(/(<li>[\s\S]*?<\/li>)(\n(?!<li>)|$)/g,"$1</ul>\n");
  s = s.replace(/(<li>)/g, (m, p, offset, str) => {
    const before = str.slice(0, offset);
    return before.match(/<\/ul>\s*$|^[^<]*$/) ? "<ul>" + m : m;
  });

  // Paragraphs
  s = s.replace(/\n\n+/g,"</p><p>");
  s = s.replace(/^(?!<[hHuUpPlLtTbBdDpP]|$)/gm,"<p>");
  s = s.replace(/\n/g,"<br>");
  if (!s.startsWith("<")) s = "<p>" + s;

  return s;
}

function navigateRelative(relPath) {
  const node = findDocsByRelPath(TREE_DATA, relPath, _current_docs_base);
  if (node) selectNodeById(node.id);
  else {
    const full = `https://github.com/${_repo_owner}/${_repo_name}/blob/master/${relPath}`;
    pywebview.api.open_url(full);
  }
}

// ── Depth control ─────────────────────────────────────────────────────────────
function onDepthChange(val) {
  document.getElementById("depth-val").textContent = val;
  // TODO: re-fetch at new depth (requires Python round-trip)
}

// ── Selection count ───────────────────────────────────────────────────────────
function updateSelectionCount() {
  const count = document.querySelectorAll(".check:checked").length;
  document.getElementById("selection-count").textContent =
    count > 0 ? `${count} item(s) selected` : "Nothing selected";
  document.getElementById("add-btn").disabled = count === 0;
}

function getSelectedIds() {
  return Array.from(document.querySelectorAll(".check:checked")).map(cb => cb.dataset.id);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function doConfirm() {
  const selected = getSelectedIds();
  if (selected.length === 0) return;
  pywebview.api.confirm(JSON.stringify({ action: "confirm", selected }));
}

function doCancel() {
  pywebview.api.close();
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function escAttr(s) {
  return String(s||"").replace(/'/g,"\\'").replace(/"/g,"&quot;");
}
function escapeSQ(s) {
  return String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}
