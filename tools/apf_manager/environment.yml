name: apf_manager
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  # cx_Freeze via conda-forge — ensures freeze_core is binary-compatible with
  # conda's Python and MSVC runtime. Do NOT install via pip (causes DLL
  # version mismatches in the frozen exe on machines without matching MSVC redist).
  - cx_Freeze>=6.15.0
  - pip:
      # GUI (kivy installed via conda-forge, not pip, to avoid SDL2/GLEW conflicts)
      # Run: conda install kivy pillow -y
      # Then: pip install https://github.com/kivymd/KivyMD/archive/master.zip
      - https://github.com/kivymd/KivyMD/archive/master.zip
      # HTTP + Steam CDN thumbnail fetching
      - requests>=2.31.0
      # Optional: plyer for file pickers (native OS dialogs)
      - plyer>=2.1.0
      # HTML documentation viewer (pywebview frameless window)
      - pywebview>=4.0
      # Markdown → HTML rendering for docs viewer
      - markdown>=3.5
      # GitHub REST API client (typed; used by GitHubAPI for all GitHub features)
      - githubkit>=0.14.0
      # HTTP client (githubkit dep; used directly for raw CDN + asset downloads)
      - httpx>=0.27.0